<div class="auth-container">
  <div class="auth-card">
    <h2>Welcome Back 🧪</h2>
    <p>Sign in to continue testing your knowledge.</p>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="••••••••" />
      </div>

      <button type="submit" class="btn-primary">Sign In →</button>
    </form>

    <p class="auth-switch">
      Don't have an account? <a routerLink="/register">Register here</a>
    </p>
  </div>
</div>
