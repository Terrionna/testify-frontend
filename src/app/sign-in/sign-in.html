<div class="auth-card">
  <h2>Sign In</h2>
  <form (submit)="submit($event, email.value, password.value)">
    <label class="field">
      Email
      <input #email class="field-input" type="email" placeholder="Enter your email" required />
    </label>
    <label class="field">
      Password
      <input #password class="field-input" type="password" placeholder="Enter your password" required />
    </label>
    <button type="submit" class="button" [disabled]="busy()">Sign In</button>
  </form>
  @if (error()) {
  <p class="message bad">{{ error() }}</p>
  }
  <p>Don't have an account? <a routerLink="/register">Register</a></p>
</div>
