<nav class="nav">
  <div class="nav-container">
    <a routerLink="/test-list" class="logo" (click)="onLogoClick($event)">
      <span>TEST</span>
      <img src="/octopus.png"
           alt="🐙"
           class="logo-icon"
           [class.bouncing]="isBouncing"
           (click)="triggerMascotGame($event)" />
      <span>IFY</span>
    </a>
    <div class="nav-links">
      <a routerLink="/sign-in" class="nav-btn">Sign In</a>
    </div>
  </div>
</nav>

<!-- Interactive Floating Easter Egg Mascot -->
<div *ngIf="isGameActive"
     class="floating-mascot-overlay"
     (click)="popMascot()">
  <div class="mascot-dialog">
    <p>🎉 You found the secret octopus! Click anywhere to pop me back! (Score: {{ catchCount }})</p>
  </div>
  <img src="/octopus.png"
       alt="Secret Mascot"
       class="interactive-octopus"
       [style.top.px]="mascotY"
       [style.left.px]="mascotX"
       (click)="catchMascot($event)" />
</div>

<main class="container">
  <router-outlet></router-outlet>
</main>
