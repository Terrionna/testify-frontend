<header class="nav">
  <div class="nav-container">
    <nav class="nav-left">
      @if (auth.isLoggedIn()) {
      <a class="nav-link" routerLink="/test-list" routerLinkActive="active">Tests</a>
      <a class="nav-link" routerLink="/my-results" routerLinkActive="active">My Results</a>
      }
      <a class="nav-link" routerLink="/verify-certificate" routerLinkActive="active">Verify Cert</a>
      @if (auth.isAdmin()) {
      <a class="nav-link" routerLink="/admin-tests" routerLinkActive="active">Admin</a>
      }
    </nav>

    <a class="logo" routerLink="/">
      <span>TEST</span>
      <img class="logo-icon" src="octopus.png" alt="" />
      <span>IFY</span>
    </a>

    <div class="nav-links">
      @if (auth.isLoggedIn()) {
      <span class="user-name">{{ auth.name() }}</span>
      <a class="nav-btn" (click)="signOut()">Sign Out</a>
      } @else {
      <a class="nav-btn" routerLink="/sign-in">Sign In</a>
      <a class="nav-btn" routerLink="/register">Register</a>
      }
    </div>
  </div>
</header>

<main class="container">
  <router-outlet />
</main>

<app-octopus-mascot />
